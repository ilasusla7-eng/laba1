[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "text-analyzer"
version = "0.1.0"
description = "A production-ready CLI text analysis tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
text-analyzer = "text_analyzer.cli:main"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/text_analyzer --cov-report=term-missing"